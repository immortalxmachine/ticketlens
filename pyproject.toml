[project]
name = "ticketlens"
version = "1.0.0"
description = "NLP benchmark: support-ticket intent classification and dialogue summarization"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B905"]  # zip(strict=) adds noise for beginners; lengths always match here

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
